<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<link rel="manifest" href="manifest-caisse-hebergement.json">
<link rel="icon" href="icon-192.png">
<title>K-Dreams — Caisse Hébergement</title>
<style>
  :root{--bg:#0D0D0D;--gold:#D4AF37;--card:#152A20;--text:#F1EFE8;--muted:#8a8a85;--danger:#A32D2D;--warn:#E0A526;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  .login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;}
  .login .logo{color:var(--gold);font-size:26px;font-weight:700;letter-spacing:1px;}
  .login .sub{color:var(--muted);margin:6px 0 26px;font-size:14px;}
  .login input{width:180px;text-align:center;font-size:26px;letter-spacing:10px;padding:12px;border-radius:12px;border:1px solid var(--gold);background:#111310;color:var(--text);}
  .login button{margin-top:16px;width:180px;padding:13px;border-radius:12px;border:none;background:var(--gold);color:#0D0D0D;font-weight:700;font-size:15px;}
  .err{color:#e06b6b;font-size:13px;margin-top:10px;min-height:16px;}
  #app{display:none;}
  .top{position:sticky;top:0;z-index:5;background:#0D0D0D;border-bottom:1px solid #2a2a26;padding:12px 16px;display:flex;align-items:center;gap:10px;}
  .top .t{flex:1;}
  .top .t b{color:var(--gold);font-size:16px;}
  .top .t div{color:var(--muted);font-size:12px;margin-top:2px;}
  .badge{background:var(--gold);color:#0D0D0D;border-radius:20px;padding:4px 12px;font-weight:700;font-size:14px;}
  .out{background:none;border:1px solid #3a3a35;color:var(--muted);border-radius:8px;padding:6px 10px;font-size:12px;}
  .list{padding:14px 14px 40px;max-width:560px;margin:0 auto;}
  .empty{color:var(--muted);text-align:center;padding:60px 0;font-size:14px;}
  .ord{background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:14px;margin-bottom:14px;}
  .ord .h{display:flex;justify-content:space-between;align-items:baseline;}
  .ord .tb{color:var(--gold);font-weight:700;font-size:17px;}
  .ord .tm{color:var(--muted);font-size:12px;}
  .ord .cl{margin-top:6px;font-size:14px;}
  .ord .cl b{color:var(--gold);}
  .ord ul{list-style:none;padding:0;margin:10px 0;}
  .ord li{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;border-bottom:1px dashed #2d4a3a;}
  .ord .tot{display:flex;justify-content:space-between;font-weight:700;color:var(--gold);font-size:16px;margin-top:8px;}
  .pm{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:14px;font-size:12px;border:1px solid var(--gold);color:var(--gold);}
  .warn{color:var(--warn);font-size:12px;margin-top:6px;}
  .acts{display:flex;gap:10px;margin-top:12px;}
  .acts button{flex:1;padding:12px;border-radius:10px;font-weight:700;font-size:14px;border:none;}
  .ok{background:var(--gold);color:#0D0D0D;}
  .no{background:transparent;color:#e06b6b;border:1px solid var(--danger)!important;}
  .new{animation:pulse 1.2s ease 3;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(212,175,55,.7);}100%{box-shadow:0 0 0 16px rgba(212,175,55,0);}}
</style>
</head>
<body>
<div class="login" id="login">
  <div class="logo">K-DREAMS</div>
  <div class="sub">Caisse · Hébergement</div>
  <input id="cname" type="text" placeholder="Votre nom" maxlength="30" autocomplete="off" style="width:220px;text-align:center;font-size:17px;letter-spacing:normal;margin-bottom:12px;">
  <input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
  <button onclick="doLogin()">Entrer</button>
  <div class="err" id="err"></div>
</div>

<div id="app">
  <div class="top">
    <div class="t"><b>Caisse Hébergement</b><div id="status">Connexion…</div></div>
    <span class="badge" id="count">0</span>
    <button class="out" onclick="logout()">Quitter</button>
  </div>
  <div class="list" id="list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAMbijp8xA3BLbaulDxZRzSh_jBNI8cqK8",
  authDomain: "omba-p-lounge.firebaseapp.com",
  projectId: "omba-p-lounge",
  storageBucket: "omba-p-lounge.firebasestorage.app",
  messagingSenderId: "469786469177",
  appId: "1:469786469177:web:614e9c606f58ba79e6bee8"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const ESPACE = "hebergement";
const LABEL = "Hébergement";
const CODE = "1749";
const SKEY = "kd_caisse_" + ESPACE;
const PM = {mtn:'MTN MoMo', orange:'Orange Money', terminal:'Terminal (carte)', especes:'Espèces'};
let audioCtx = null, unsub = null, firstLoad = true, orders = [];

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }

function money(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ') + ' FCFA'; }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function beep(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    [0,0.25,0.5].forEach(t=>{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type='sine'; o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.25, audioCtx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+t+0.2);
      o.start(audioCtx.currentTime+t); o.stop(audioCtx.currentTime+t+0.22);
    });
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([250,120,250]);
}

function detectDevice(){
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  return isStandalone ? 'PWA' : 'Site web';
}
const PRES_ID = 'kdreams_' + ESPACE;
let presInterval = null;

function logConnection(){
  const cname = localStorage.getItem(NKEY) || LABEL;
  db.collection('connections').add({
    role: LABEL, cashierName: cname, device: detectDevice(), etablissement:'kdreams',
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(()=>{});
}
function presenceOnline(){
  const cname = localStorage.getItem(NKEY) || LABEL;
  db.collection('presence').doc(PRES_ID).set({
    cashierName: cname, role: LABEL, etablissement:'kdreams', device: detectDevice(),
    status:'online', loginAt: firebase.firestore.FieldValue.serverTimestamp(),
    lastActive: firebase.firestore.FieldValue.serverTimestamp()
  }, {merge:true}).catch(()=>{});
}
function presenceBeat(){
  db.collection('presence').doc(PRES_ID).set({
    status:'online', lastActive: firebase.firestore.FieldValue.serverTimestamp()
  }, {merge:true}).catch(()=>{});
}
function presenceOffline(){
  db.collection('presence').doc(PRES_ID).set({
    status:'offline', loggedOutAt: firebase.firestore.FieldValue.serverTimestamp()
  }, {merge:true}).catch(()=>{});
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && localStorage.getItem(SKEY)==='1') presenceOffline(); else if(document.visibilityState==='visible' && localStorage.getItem(SKEY)==='1') presenceOnline(); });
window.addEventListener('beforeunload', ()=>{ if(localStorage.getItem(SKEY)==='1') presenceOffline(); });

const NKEY = SKEY + '_name';
function doLogin(){
  const name = document.getElementById('cname').value.trim();
  const v = document.getElementById('pin').value.trim();
  if(name.length < 2){ document.getElementById('err').textContent = 'Indiquez votre nom'; return; }
  if(v !== CODE){ document.getElementById('err').textContent = 'Code incorrect'; return; }
  localStorage.setItem(SKEY,'1');
  localStorage.setItem(NKEY, name);
  start();
}
document.getElementById('pin').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('cname').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('pin').focus(); });
function logout(){ presenceOffline(); localStorage.removeItem(SKEY); localStorage.removeItem(NKEY); if(unsub) unsub(); location.reload(); }

function start(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  logConnection();
  presenceOnline();
  if(presInterval) clearInterval(presInterval);
  presInterval = setInterval(presenceBeat, 30000);
  unsub = db.collection('kdreams_orders').where('espace','==',ESPACE).onSnapshot(snap=>{
    if(!firstLoad){
      snap.docChanges().forEach(ch=>{ if(ch.type==='added' && !ch.doc.metadata.hasPendingWrites) { beep(); markNew(ch.doc.id); } });
    }
    firstLoad = false;
    orders = snap.docs.map(d=>({id:d.id, ...d.data()})).filter(o=>o.status==='en_attente');
    orders.sort((a,b)=>(a.createdMs||0)-(b.createdMs||0));
    document.getElementById('status').textContent = (localStorage.getItem(NKEY) ? localStorage.getItem(NKEY) + ' · ' : '') + 'En ligne · temps réel';
    draw();
  }, err=>{
    document.getElementById('status').textContent = 'Erreur de connexion';
  });
}

let newIds = {};
function markNew(id){ newIds[id]=true; setTimeout(()=>{ delete newIds[id]; }, 5000); }

function draw(){
  const list = document.getElementById('list');
  document.getElementById('count').textContent = orders.length;
  if(!orders.length){ list.innerHTML = '<div class="empty">Aucune commande en attente</div>'; return; }
  list.innerHTML = orders.map(o=>{
    const t = new Date(o.createdMs||Date.now()).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    const lines = (o.items||[]).map(i=>'<li><span>'+esc(i.nom)+' ×'+i.q+'</span><span>'+(i.prix===null?'à confirmer':money(i.prix*i.q))+'</span></li>').join('');
    const verify = (o.payMode==='mtn'||o.payMode==='orange') ? '<div class="warn">⚠️ À vérifier : confirmation du paiement mobile</div>' : '';
    const unpriced = o.hasUnpriced ? '<div class="warn">⚠️ Contient des articles sans prix — total à compléter</div>' : '';
    return '<div class="ord'+(newIds[o.id]?' new':'')+'">'
      + '<div class="h"><span class="tb">'+(o.table?('Table '+o.table):'Sans table')+'</span><span class="tm">'+t+'</span></div>'
      + '<div class="cl">👤 <b>'+esc(o.customerName||'—')+'</b>'+(o.customerPhone?' · 📞 '+esc(o.customerPhone):'')+'</div>'
      + '<ul>'+lines+'</ul>'
      + '<div class="tot"><span>Total</span><span>'+money(o.total||0)+'</span></div>'
      + '<span class="pm">'+(PM[o.payMode]||o.payMode)+'</span>'+verify+unpriced
      + '<div class="acts"><button class="ok" onclick="encaisser(\''+o.id+'\')">Encaisser (fonds reçus)</button><button class="no" onclick="annuler(\''+o.id+'\')">✕ Annuler</button></div>'
      + '</div>';
  }).join('');
}

async function archiver(o, statut, motif){
  const data = {...o}; delete data.id;
  data.orderStatus = statut; data.closedMs = Date.now();
  data.closedAt = firebase.firestore.FieldValue.serverTimestamp();
  if(motif) data.motif = motif;
  await db.collection('kdreams_archive').add(data);
  await db.collection('kdreams_orders').doc(o.id).delete();
}

async function encaisser(id){
  const o = orders.find(x=>x.id===id); if(!o) return;
  try{
    await archiver(o,'validee');
    facturePDF(o);
  }catch(e){ alert("Erreur d'enregistrement. Vérifiez la connexion et réessayez."); }
}

async function annuler(id){
  const o = orders.find(x=>x.id===id); if(!o) return;
  const motif = prompt('Motif de l\'annulation (facultatif) :');
  if(motif === null) return;
  try{ await archiver(o,'annulee', motif); }
  catch(e){ alert("Erreur d'enregistrement. Vérifiez la connexion et réessayez."); }
}

function facturePDF(o){
  try{
    const { jsPDF } = window.jspdf;
    const d = new jsPDF({unit:'mm', format:'a5'});
    const W = 148; let y = 18;
    d.setFont('helvetica','bold'); d.setFontSize(20); d.setTextColor(150,120,20);
    d.text('K-DREAMS', W/2, y, {align:'center'}); y+=6;
    d.setFont('helvetica','normal'); d.setFontSize(9); d.setTextColor(90,90,90);
    d.text('Drink · Eat · Rest', W/2, y, {align:'center'}); y+=10;
    d.setTextColor(0,0,0); d.setFontSize(11);
    d.text('Facture - ' + LABEL, 14, y); y+=6;
    d.setFontSize(9);
    d.text('Date : ' + new Date(o.createdMs||Date.now()).toLocaleString('fr-FR'), 14, y); y+=5;
    d.text('Client : ' + (o.customerName||'-') + (o.customerPhone ? '   |   Tel : ' + o.customerPhone : ''), 14, y); y+=5;
    d.text((o.table?('Table : '+o.table):'Sans table') + '   |   Paiement : ' + (PM[o.payMode]||o.payMode), 14, y); y+=8;
    d.setDrawColor(200,200,200); d.line(14,y,W-14,y); y+=6;
    (o.items||[]).forEach(i=>{
      d.text(i.nom + '  x' + i.q, 14, y);
      d.text(i.prix===null ? 'a confirmer' : money(i.prix*i.q), W-14, y, {align:'right'});
      y+=6;
      if(y>185){ d.addPage(); y=18; }
    });
    d.line(14,y,W-14,y); y+=8;
    d.setFont('helvetica','bold'); d.setFontSize(12);
    d.text('TOTAL', 14, y); d.text(money(o.total||0), W-14, y, {align:'right'}); y+=6;
    d.setFontSize(10); d.setTextColor(30,120,60); d.text('SOLDEE', 14, y); y+=14;
    d.setFont('helvetica','italic'); d.setFontSize(9); d.setTextColor(90,90,90);
    d.text('Vivement de vous revoir tres bientot - K-Dreams', W/2, y, {align:'center'});
    d.save('facture-kdreams-' + ESPACE + '-' + Date.now() + '.pdf');
  }catch(e){ console.error(e); }
}

if(localStorage.getItem(SKEY)==='1'){ start(); }
</script>
</body>
</html>
